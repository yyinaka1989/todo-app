<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TODOアプリ</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <h1>TODOアプリ</h1>

    <form id="todo-form" class="todo-form">
      <input
        type="text"
        id="todo-input"
        class="todo-input"
        placeholder="やることを入力"
        autocomplete="off"
      >
      <button type="submit" class="todo-add-button">追加</button>
    </form>

    <ul id="todo-list" class="todo-list"></ul>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
